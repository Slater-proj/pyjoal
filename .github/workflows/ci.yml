name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  # ============================================
  # STAGE 1: Quality Gates (MUST PASS)
  # ============================================

  test-backend:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio watchdog

    - name: Run pytest
      working-directory: backend
      env:
        SECRET_TOKEN: test-secret-token
        UI_PATH_PREFIX: /test
        CONFIG_DIR: /tmp/pyjoal_test/config
        TORRENTS_DIR: /tmp/pyjoal_test/torrents
        CLIENTS_DIR: /tmp/pyjoal_test/clients
      run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75

    - name: Upload coverage to Codecov
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: backend/coverage.xml
        verbose: true

  lint-backend:
    name: "Backend Linting"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: pip install flake8

    - name: Flake8
      working-directory: backend
      run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503,E501,W291,W292,W293,W391,E128,E302,E303,E305,E402

  security-backend:
    name: "Backend Security"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install tools
      working-directory: backend
      run: |
        pip install -r requirements.txt
        pip install bandit

    - name: Bandit (high severity)
      working-directory: backend
      run: bandit -r app/ -ll --skip B104,B324,B501

  test-frontend:
    name: "Frontend Tests"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: frontend
      run: npm install

    - name: TypeScript type check
      working-directory: frontend
      run: npx tsc --noEmit

    - name: ESLint
      working-directory: frontend
      run: npm run lint

    - name: Run tests
      working-directory: frontend
      run: npm run test:ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  # ============================================
  # STAGE 2: Build Docker (only on master push)
  # ============================================

  build-docker:
    name: "Build Docker"
    needs: [test-backend, lint-backend, security-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d '\n')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t pyjoal:${{ steps.version.outputs.version }} -t pyjoal:latest .
        docker save pyjoal:latest | gzip > pyjoal-image.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: pyjoal-image.tar.gz
        retention-days: 1
        compression-level: 0

  # ============================================
  # STAGE 3: Validate Docker image
  # ============================================

  docker-security:
    name: "Docker Security Scan"
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load Docker image
      run: gunzip -c /tmp/pyjoal-image.tar.gz | docker load

    - name: Trivy (CRITICAL vulns = FAIL)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "pyjoal:latest"
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: "CRITICAL"

    - name: Trivy full report (informational)
      if: always()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "pyjoal:latest"
        format: "table"
        severity: "HIGH,CRITICAL"

  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
    - uses: actions/checkout@v4

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load and run container
      run: |
        gunzip -c /tmp/pyjoal-image.tar.gz | docker load
        docker run -d --name pyjoal-test -p 8080:8080 \
          -e SECRET_TOKEN=smoke-test-token \
          -e UI_PATH_PREFIX=/ \
          pyjoal:latest

    - name: Wait for startup
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
            echo "✅ Container is healthy"
            exit 0
          fi
          sleep 2
        done
        echo "❌ Container failed to start"
        docker logs pyjoal-test
        exit 1

    - name: Test API endpoints
      run: curl -sf http://localhost:8080/health && echo " ✅ /health OK"

    - name: Cleanup
      if: always()
      run: docker rm -f pyjoal-test || true

  # ============================================
  # STAGE 4: Publish to Docker Hub
  # ============================================

  publish:
    name: "Publish to Docker Hub"
    needs: [build-docker, docker-security, smoke-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: echo "version=$(cat VERSION | tr -d '\n')" >> $GITHUB_OUTPUT

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load image
      run: gunzip -c /tmp/pyjoal-image.tar.gz | docker load

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag and push to Docker Hub
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="${{ secrets.DOCKERHUB_USERNAME }}/pyjoal"
        docker tag pyjoal:latest "$REPO:v$VERSION"
        docker tag pyjoal:latest "$REPO:latest"
        docker push "$REPO:v$VERSION"
        docker push "$REPO:latest"
        echo "✅ Published $REPO:v$VERSION and $REPO:latest"

    - name: Update Docker Hub description
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal
        readme-filepath: ./DOCKER_HUB_README.md

  # ============================================
  # STAGE 5: GitHub Release
  # ============================================

  release:
    name: "Create GitHub Release"
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: echo "version=$(cat VERSION | tr -d '\n')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: PyJOAL v${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
