name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # Déclenche sur toutes les branches
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  # ============================================
  # STAGE 1: Quality Gates (MUST PASS)
  # ============================================
  
  test-backend:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run pytest (MUST PASS)
      working-directory: backend
      env:
        SECRET_TOKEN: test-secret-token
        UI_PATH_PREFIX: /test
        CONFIG_DIR: /tmp/pyjoal_test/config
        TORRENTS_DIR: /tmp/pyjoal_test/torrents
        CLIENTS_DIR: /tmp/pyjoal_test/clients
      run: |
        echo "🧪 Running backend tests..."
        pip install watchdog  # Required for file_watcher tests
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=45
        echo "✅ All tests passed!"
    
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/htmlcov/
        retention-days: 7

    - name: Upload coverage to Codecov
      if: github.ref == 'refs/heads/master'
      uses: codecov/codecov-action@v4
      with:
        directory: backend
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint-backend:
    name: "Backend Linting"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: pip install flake8 black isort
    
    - name: Flake8 (MUST PASS - syntax errors)
      working-directory: backend
      run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503,E501,W291,W292,W293,W391,E128,E302,E303,E305,E402
    
    - name: Black (formatting) - Warning only
      working-directory: backend
      continue-on-error: true
      run: black --check --diff app/
    
    - name: isort (imports) - Warning only
      working-directory: backend
      continue-on-error: true
      run: isort --check-only --diff app/

  security-backend:
    name: "Backend Security"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install security tools
      working-directory: backend
      run: |
        pip install -r requirements.txt
        pip install bandit safety
    
    - name: Bandit (MUST PASS - high severity only)
      working-directory: backend
      run: bandit -r app/ -ll --skip B104,B324,B501
    
    - name: Safety (dependency vulnerabilities) - Warning only
      working-directory: backend
      continue-on-error: true
      run: safety check --full-report

  test-frontend:
    name: "Frontend Tests"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      working-directory: frontend
      run: npm install
    
    - name: TypeScript type check (MUST PASS)
      working-directory: frontend
      run: npx tsc --noEmit
    
    - name: ESLint (MUST PASS)
      working-directory: frontend
      run: npm run lint
    
    - name: Run tests
      working-directory: frontend
      continue-on-error: true
      run: npm run test:ci --if-present || echo "No test:ci script"
    
    - name: Build frontend (MUST PASS)
      working-directory: frontend
      run: npm run build

  # ============================================
  # STAGE 2: Build (only if tests pass)
  # ============================================

  # Docker Image Vulnerability Scan
  docker-security:
    name: "Docker Security Scan"
    runs-on: ubuntu-latest
    needs: [build-docker]
    
    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    
    - name: Load Docker image
      run: |
        gunzip -c /tmp/pyjoal-image.tar.gz | docker load
        echo "✅ Image loaded for security scan"
    
    - name: Run Trivy (CRITICAL vulns = FAIL)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "pyjoal:latest"
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: "CRITICAL"
    
    - name: Trivy full report (informational)
      if: always()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "pyjoal:latest"
        format: "table"
        severity: "HIGH,CRITICAL"

  # Smoke Tests : Tests rapides après build
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    
    - name: Load and run container
      run: |
        gunzip -c /tmp/pyjoal-image.tar.gz | docker load
        docker run -d --name pyjoal-test -p 8080:8080 -e SECRET_TOKEN=smoke-test-token -e UI_PATH_PREFIX=/ pyjoal:latest
    
    - name: Wait for startup (MUST PASS)
      run: |
        echo "Waiting for container..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
            echo "Container is healthy!"
            exit 0
          fi
          sleep 2
        done
        echo "Container failed to start"
        docker logs pyjoal-test
        exit 1
    
    - name: Test API endpoints
      run: |
        curl -sf http://localhost:8080/health && echo " /health OK"
        curl -sf http://localhost:8080/ > /dev/null && echo " / OK"
    
    - name: Cleanup
      if: always()
      run: docker rm -f pyjoal-test || true

  # Dependency Updates Check (informational only)
  dependency-check:
    name: "Check Outdated Dependencies"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Python dependencies
      working-directory: backend
      continue-on-error: true
      run: |
        pip install -r requirements.txt
        pip list --outdated || echo "All up to date"
    
    - name: Check npm dependencies
      working-directory: frontend
      continue-on-error: true
      run: |
        npm install
        npm outdated || echo "All up to date"

  # Build Docker : Seulement sur master
  build-docker:
    name: "Build Docker"
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d '\n')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t pyjoal:${{ steps.version.outputs.version }} -t pyjoal:latest .
        docker save pyjoal:latest | gzip > pyjoal-image.tar.gz
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: pyjoal-image.tar.gz
        retention-days: 1
        compression-level: 0

  # ============================================
  # STAGE 4: Deploy (only after all validations)
  # ============================================

  push-dockerhub:
    name: "Push to Docker Hub"
    needs: [build-docker, docker-security, smoke-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: version
      run: echo "version=$(cat VERSION | tr -d '\n')" >> $GITHUB_OUTPUT
    
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    
    - name: Load image
      run: gunzip -c /tmp/pyjoal-image.tar.gz | docker load
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Tag and push
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="${{ secrets.DOCKERHUB_USERNAME }}/pyjoal"
        docker tag pyjoal:latest "$REPO:v$VERSION"
        docker tag pyjoal:latest "$REPO:latest"
        docker push "$REPO:v$VERSION"
        docker push "$REPO:latest"
    
    - name: Update Docker Hub description
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal
        readme-filepath: ./DOCKER_HUB_README.md

  # Auto Release : Seulement après publication Docker Hub validée
  auto-release:
    name: "Create GitHub Release"
    needs: [push-dockerhub]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate version and release
      run: |
        VERSION=$(cat VERSION | tr -d '\n')
        echo "NEW_VERSION=v$VERSION" >> $GITHUB_ENV
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.NEW_VERSION }}
        name: PyJOAL ${{ env.NEW_VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}