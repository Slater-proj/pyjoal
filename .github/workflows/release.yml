name: Release & Deploy

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx

    - name: Create test environment
      working-directory: backend
      run: |
        mkdir -p test_config test_torrents test_clients
        echo "SECRET_TOKEN=test-token" > .env
        echo "UI_PATH_PREFIX=test" >> .env
        echo "CONFIG_DIR=./test_config" >> .env
        echo "TORRENTS_DIR=./test_torrents" >> .env
        echo "CLIENTS_DIR=./test_clients" >> .env

    - name: Run backend tests
      working-directory: backend
      env:
        PYTHONPATH: .
        SECRET_TOKEN: test-token
        UI_PATH_PREFIX: test
        CONFIG_DIR: ./test_config
        TORRENTS_DIR: ./test_torrents
        CLIENTS_DIR: ./test_clients
      run: |
        echo "Testing Python imports..."
        python -c "import app.core.config; print('✅ Config import OK')"
        python -c "import app.main; print('✅ Main app import OK')"
        python -c "import app.services.seeder_service; print('✅ Services import OK')"
        echo "✅ Backend validation completed successfully"

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: |
        echo "Testing TypeScript compilation..."
        npx tsc --noEmit
        echo "✅ TypeScript type check passed"
        
        echo "Testing frontend build..."
        npm run build
        echo "✅ Frontend build completed successfully"

  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: pyjoal:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/pyjoal.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/pyjoal.tar
        retention-days: 1

  push-dockerhub:
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load Docker image
      run: |
        docker load --input /tmp/pyjoal.tar
        docker tag pyjoal:latest ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:latest
        docker tag pyjoal:latest ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:${{ github.sha }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:${{ github.sha }}
        echo "✅ Successfully pushed to Docker Hub!"

  auto-release:
    needs: [build-docker, push-dockerhub]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get next version
      id: version
      run: |
        # Récupérer le dernier tag
        LAST_TAG=$(git tag --sort=-version:refname | head -n 1 || echo "v0.0.0")
        echo "Last tag: $LAST_TAG"
        
        # Incrémenter la version patch
        if [[ $LAST_TAG =~ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
        else
          NEW_VERSION="v1.0.0"
        fi
        
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ steps.version.outputs.NEW_VERSION }} -m "Auto-release ${{ steps.version.outputs.NEW_VERSION }}"
        git push origin ${{ steps.version.outputs.NEW_VERSION }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.NEW_VERSION }}
        name: PyJOAL ${{ steps.version.outputs.NEW_VERSION }}
        body: |
          ## PyJOAL ${{ steps.version.outputs.NEW_VERSION }}
          
          **Déploiement automatique depuis la branche master**
          
          ### 🐳 Docker Images
          - `${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:latest`
          - `${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:${{ github.sha }}`
          
          ### 🚀 Quick Start
          ```bash
          docker run -d --name pyjoal \
            -p 8080:8080 \
            -v $(pwd)/config:/app/config \
            -v $(pwd)/torrents:/app/torrents \
            -v $(pwd)/clients:/app/clients \
            -e SECRET_TOKEN=your-secret-token \
            ${{ secrets.DOCKERHUB_USERNAME }}/pyjoal:latest
          ```
          
          ### 📋 Changements
          Commits inclus dans cette release :
          ${{ github.event.head_commit.message }}
          
          ### 🔧 Configuration
          Définissez votre variable d'environnement `SECRET_TOKEN` pour sécuriser l'API.
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}