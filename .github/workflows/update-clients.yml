name: Update BitTorrent Clients

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-clients:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Update client files
        run: |
          python scripts/update_clients.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain clients/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "New client versions found!"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No new versions."
          fi
          
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update BitTorrent client versions'
          title: '🔄 Update BitTorrent Client Versions'
          body: |
            Automated update of BitTorrent client definitions.
            
            This PR was automatically generated by checking for new releases on GitHub.
            
            **Changes:**
            - Updated client definitions to latest versions
            - Old versions retained for compatibility
            
            Please review the changes and merge if everything looks correct.
          branch: auto-update-clients
          delete-branch: true
          labels: |
            dependencies
            automated
