<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d4f6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a8a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5cb85c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="chevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80cbc4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagonal shape -->
  <path d="M256 20 L460 140 L460 372 L256 492 L52 372 L52 140 Z" fill="url(#bg)" rx="30"/>
  <!-- Wave overlay -->
  <path d="M120 180 Q200 120 280 200 Q340 260 256 320 Q180 260 120 300 Z" fill="url(#wave)" opacity="0.6"/>
  <!-- Inner chevron -->
  <path d="M220 220 L280 260 L280 320 L220 360 L180 320 L180 260 Z" fill="url(#chevron)" stroke="#fff" stroke-width="6" opacity="0.9"/>
  <!-- Accent layers at bottom -->
  <path d="M100 370 L256 460 L412 370 L412 400 L256 490 L100 400 Z" fill="#4caf50" opacity="0.7"/>
</svg>
